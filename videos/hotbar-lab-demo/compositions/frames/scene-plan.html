<template id="scene-plan">
<style>
[id^="scene-plan-"]{font-family:Inter;color:#EEEADE}

@font-face{font-family:Inter;src:url("assets/inter-400.woff2") format("woff2");font-weight:400;font-style:normal}
@font-face{font-family:Inter;src:url("assets/inter-700.woff2") format("woff2");font-weight:700;font-style:normal}
#root,[id="scene-plan"]{position:relative;width:100%;height:100%;overflow:hidden;container-type:size;font-family:Inter;color:#EEEADE}
[id="scene-plan"] *{box-sizing:border-box}
[id="scene-plan-bg"]{position:absolute;inset:0;width:1920px;height:1080px;background:#141714}
[id="scene-plan-brand"]{position:absolute;left:96px;top:68px;height:40px;display:flex;align-items:center;gap:16px;font-size:24px;letter-spacing:3px;font-weight:700}
[id="scene-plan-brand"] img{width:40px;height:40px}
[id="scene-plan-badge"]{position:absolute;right:96px;top:68px;padding:12px 20px;border:1px solid rgba(165,199,107,.2);border-radius:100px;background:rgba(165,199,107,.08);color:#A5C76B;font-size:18px;font-weight:700;letter-spacing:2px}
[id="scene-plan-eyebrow"]{position:absolute;left:96px;top:220px;color:#A5C76B;font-size:24px;font-weight:700;letter-spacing:2px}
[id="scene-plan-title"]{position:absolute;left:96px;top:265px;width:490px;margin:0;font-size:72px;line-height:1.08;letter-spacing:-2px;font-weight:700}
[id="scene-plan-support"]{position:absolute;left:96px;top:570px;width:490px;min-height:150px;font-size:28px;line-height:1.5;color:#989F94}
[id="scene-plan-panel"]{position:absolute;left:640px;top:180px;width:1200px;height:750px;overflow:hidden;border:1px solid rgba(165,199,107,.2);border-radius:14px}
[id="scene-plan-panel"] img{position:absolute;inset:0;width:1200px;height:750px;object-fit:contain}
[id="scene-plan-chapters"]{position:absolute;left:96px;top:880px;display:flex;gap:30px;font-size:21px;color:#989F94}
[id="scene-plan-chapters"] span:first-child{color:#A5C76B;font-weight:700}
[id="scene-plan-caption-line"]{position:absolute;left:96px;top:947px;width:1728px;height:1px;background:rgba(165,199,107,.2)}
[id="scene-plan-caption-a"],[id="scene-plan-caption-b"],[id="scene-plan-caption-c"]{position:absolute;left:96px;top:960px;max-width:1728px;min-height:44px;font-size:27px;line-height:1.3;color:#EEEADE}
[id="scene-plan-cursor"]{position:absolute;left:0;top:0;width:44px;height:44px;pointer-events:none;z-index:999;transform-origin:5.5px 5.1px}
[id="scene-plan-cursor"] svg{width:100%;height:100%}
[id="scene-plan-pulse"]{position:absolute;left:817.17px;top:747.17px;width:24px;height:24px;border:2px solid #A5C76B;border-radius:50%;pointer-events:none;z-index:998}
[id="scene-plan-slot-target"]{position:absolute;left:802.5px;top:712px;width:57.5px;height:63px;background-image:url("assets/plan.png");background-repeat:no-repeat;background-size:1200px 750px;background-position:-162.5px -532px;z-index:3;transform-origin:center}
</style>
<div data-hf-id="hf-7za5" id="scene-plan" data-composition-id="scene-plan" data-start="0" data-duration="11" data-width="1920" data-height="1080">
<div data-hf-id="hf-cjha" id="scene-plan-bg" class="clip" data-start="0" data-duration="11" data-track-index="0"></div>
<div data-hf-id="hf-7gi5" id="scene-plan-brand"><img data-hf-id="hf-9n6s" src="assets/favicon.svg" alt=""><span data-hf-id="hf-boa5">HOTBAR <b data-hf-id="hf-y37z" style="color:#A5C76B">LAB</b></span></div>
<div data-hf-id="hf-ha4v" id="scene-plan-badge">EARLY DEVELOPMENT</div>
<div data-hf-id="hf-palk" id="scene-plan-eyebrow">01 / PLAN</div>
<h1 data-hf-id="hf-kpgy" id="scene-plan-title">Make every slot familiar.</h1>
<div data-hf-id="hf-atzh" id="scene-plan-support">Shared keys. Scenarios for every stage.</div>
<div data-hf-id="hf-5b2o" id="scene-plan-panel"><img data-hf-id="hf-bhiv" id="scene-plan-page" src="assets/plan.png" alt="Hotbar Lab planning interface"><img data-hf-id="hf-t7do" id="scene-plan-selected" src="assets/plan-slot.png" alt="Slot 1 key and item editor"></div>
<div data-hf-id="hf-ywxo" id="scene-plan-slot-target"></div>
<div data-hf-id="hf-0fi0" id="scene-plan-chapters"><span data-hf-id="hf-qppq">Plan</span><span data-hf-id="hf-daqk">Practice</span><span data-hf-id="hf-rmdz">Export</span></div>
<div data-hf-id="hf-s8mr" id="scene-plan-caption-line"></div>
<div data-hf-id="hf-ey6v" id="scene-plan-caption-a">Plan a hotbar around your run.</div>
<div data-hf-id="hf-d3uo" id="scene-plan-caption-b">Choose a slot. Set its key. Build an item pool.</div>
<div data-hf-id="hf-jer0" id="scene-plan-caption-c">Use flex slots for the items you swap during a run.</div>
<div data-hf-id="hf-orxl" id="scene-plan-pulse"></div>
<!-- Adapted from the installed simulated-cursor primitive. -->
<div data-hf-id="hf-0vy1" id="scene-plan-cursor" aria-hidden="true"><svg data-hf-id="hf-ulu9" viewBox="0 0 24 24"><path data-hf-id="hf-h3ls" d="M3 2.8 20.6 14 12.8 15.5 9 22 3 2.8Z" fill="#EEEADE" stroke="#141714" stroke-width="1.4" /></svg></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
(function(){
const el=name=>document.getElementById("scene-plan-"+name);
const tl=gsap.timeline({paused:true});
window.__timelines=window.__timelines||{};
window.__timelines["scene-plan"]=tl;
tl.fromTo(el("brand"),{opacity:0,y:8},{opacity:1,y:0,duration:.5,ease:"power2.out"},0);
tl.fromTo(el("badge"),{opacity:0},{opacity:1,duration:.5},.2);
tl.fromTo(el("panel"),{opacity:0,y:20},{opacity:1,y:0,duration:.75,ease:"power3.out"},.05);
// Compute the opening reveal sequence once from content length.
const entries=[{id:"eyebrow",text:"01 / PLAN"},{id:"title",text:"Make every slot familiar."}];
let entryTime=.15;
const sequence=entries.map(entry=>{const start=entryTime;entryTime+=.2+entry.text.length*.018;return {...entry,start};});
sequence.forEach(entry=>tl.fromTo(el(entry.id),{opacity:0,y:18},{opacity:1,y:0,duration:.65,ease:"power3.out"},entry.start));
tl.fromTo(el("caption-line"),{opacity:0},{opacity:1,duration:.4},.5);
tl.fromTo(el("caption-a"),{opacity:0},{opacity:1,duration:.5},.6);
tl.set(el("caption-a"),{opacity:0},2.4);
tl.fromTo(el("caption-b"),{opacity:0,y:6},{opacity:1,y:0,duration:.35,ease:"power2.out"},2.4);
tl.fromTo(el("selected"),{opacity:0},{opacity:1,duration:.2},3.66);
tl.fromTo(el("cursor"),{opacity:0,x:1110,y:810},{opacity:1,x:1110,y:810,duration:.2},2.45);
tl.to(el("cursor"),{x:823.67,y:754.03,duration:.75,ease:"power2.inOut"},2.65);
tl.to(el("cursor"),{scale:.85,duration:.09,ease:"power2.in"},3.54);
tl.to(el("cursor"),{scale:1,duration:.09,ease:"power2.out"},3.63);
tl.fromTo(el("slot-target"),{opacity:0},{opacity:1,duration:.01},3.54);
tl.to(el("slot-target"),{scale:.96,duration:.09,ease:"power2.in"},3.54);
tl.to(el("slot-target"),{scale:1,duration:.09,ease:"power2.out"},3.63);
tl.set(el("slot-target"),{opacity:0},3.73);
tl.fromTo(el("pulse"),{scale:0,opacity:0},{scale:0,opacity:0,duration:.01},0);
tl.fromTo(el("pulse"),{scale:.2,opacity:.85},{scale:3.8,opacity:0,duration:.7,ease:"power2.out",immediateRender:false},3.6);
tl.to(el("cursor"),{x:994,y:803,duration:.65,ease:"power2.inOut"},4.45);
tl.fromTo(el("support"),{opacity:0,y:16},{opacity:1,y:0,duration:.65,ease:"power2.out"},5.5);
tl.set(el("caption-b"),{opacity:0},8);
tl.fromTo(el("caption-c"),{opacity:0,y:6},{opacity:1,y:0,duration:.35,ease:"power2.out"},8);
tl.fromTo(el("chapters"),{opacity:0,y:8},{opacity:1,y:0,duration:.55,ease:"power2.out"},8.3);
tl.to({},{duration:.01},10.99);
})();
</script>
</template>
