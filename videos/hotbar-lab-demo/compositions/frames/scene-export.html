  <script src="assets/gsap.min.js"></script>
  <script>
    (function(){
      const tl=gsap.timeline({paused:true});
      const shots=['.e03-shot-0','.e03-shot-1','.e03-shot-2','.e03-shot-3'];
      const captions=['.e03-caption-0','.e03-caption-1','.e03-caption-2','.e03-caption-3','.e03-caption-4'];
      // A precomputed content sequence preserves the storyboard's exact reading windows.
      const content=[{duration:3,shot:0},{duration:3,shot:1},{duration:3,shot:2},{duration:1.5,shot:3},{duration:2.5,shot:3}];
      let elapsed=0;
      const sequence=content.map((entry)=>{const start=elapsed;elapsed+=entry.duration;return {...entry,start,end:elapsed};});
      tl.set(shots.slice(1),{autoAlpha:0},0).set(captions.slice(1),{autoAlpha:0},0);
      
      tl.fromTo('.e03-pulse',{scale:0,opacity:0},{scale:0,opacity:0,duration:.01},0);
      tl.fromTo('.e03-cursor',{autoAlpha:0,x:1060,y:590},{autoAlpha:0,x:1060,y:590,duration:.01},0);
      tl.fromTo('.e03-eyebrow',{opacity:0,y:12},{opacity:1,y:0,duration:.35,ease:'power2.out'},0);
      tl.fromTo('.e03-headline',{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:'power3.out'},.05);
      tl.fromTo('.e03-panel',{opacity:.5,y:10},{opacity:1,y:0,duration:.5,ease:'power2.out'},0);
      sequence.forEach((entry,index)=>{
        if(index===0)return;
        tl.set(captions[index-1],{autoAlpha:0},entry.start);
        tl.fromTo(captions[index],{autoAlpha:0,y:6},{autoAlpha:1,y:0,duration:.2,ease:'power2.out'},entry.start);
        if(entry.shot!==sequence[index-1].shot){
          tl.set(shots[sequence[index-1].shot],{autoAlpha:0},entry.start);
          tl.set(shots[entry.shot],{autoAlpha:1},entry.start);
        }
      });
      tl.set('.e03-cursor',{autoAlpha:1},2.05);
      tl.to('.e03-cursor',{x:752.5,y:829,duration:.7,ease:'power2.inOut'},2.05);
      tl.to('.e03-cursor',{scale:.85,duration:.08,ease:'power2.in'},2.82);
      tl.to('.e03-click-target',{scale:.95,duration:.08,ease:'power2.in'},2.82);
      tl.to('.e03-cursor',{scale:1,duration:.08,ease:'power2.out'},2.90);
      tl.to('.e03-click-target',{scale:1,duration:.08,ease:'power2.out'},2.90);
      tl.fromTo('.e03-pulse',{scale:0,opacity:.9},{scale:3.5,opacity:0,duration:.65,ease:'power2.out',immediateRender:false},2.86);
      tl.set('.e03-click-target',{autoAlpha:0},3);
      tl.to('.e03-cursor',{autoAlpha:0,duration:.25},3.35);
      tl.fromTo('.e03-support',{autoAlpha:0,y:16},{autoAlpha:1,y:0,duration:.45,ease:'power2.out'},6.1);
      tl.to('.e03-panel',{opacity:.15,duration:.4,ease:'power2.out'},10.5);
      tl.fromTo('.e03-cta',{autoAlpha:0,y:14,scale:.98},{autoAlpha:1,y:0,scale:1,duration:.5,ease:'power3.out'},10.6);
      
      window.__timelines=window.__timelines||{};
      window.__timelines['scene-export']=tl;
    })();
  </script>
